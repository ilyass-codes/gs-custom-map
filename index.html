<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mappa Operazioni</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>

  <div id="map"></div>
  
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([45.5, 10.2], 8);
  
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
  
    fetch("https://vte-mappa-interventi.dev-ilyass-cherif.workers.dev")
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: function (feature, layer) {
            const p = feature.properties;
            layer.bindPopup(`
              <strong>${p.impianto_codice}</strong><br>
              ${p.impianto_nome}<br><br>
              ${p.operazione_numero}<br>
              ${p.operazione_nome}
            `);
          }
        }).addTo(map);
      });
  </script>

</body>
</html>
